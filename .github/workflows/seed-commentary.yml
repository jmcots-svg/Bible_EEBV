name: Seed Commentary

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Idioma del comentario (es/en)'
        required: true
        default: 'en'
        type: choice
        options:
          - es
          - en
      source:
        description: 'Nombre de la fuente (MHC, etc.)'
        required: true
        default: 'MHC'

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  COMMENTARY_LANG: ${{ github.event.inputs.language }}
  COMMENTARY_SOURCE: ${{ github.event.inputs.source }}

jobs:
  seed-commentary:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # ❌ Eliminado cache: 'npm' — requiere package-lock.json
      
      - name: Install dependencies
        run: npm install
      
       - name: Verify XML files exist
        run: |
          echo "📁 Verificando archivos MHC..."
          ls -la MHC/ || echo "⚠️ Directorio MHC no encontrado"
          for i in 1 2 3 4 5 6; do
            test -f MHC/mhc${i}.xml && echo "✅ mhc${i}.xml OK" || echo "❌ mhc${i}.xml NO encontrado"
          done
          
      - name: Run Commentary Seed
        run: node seed_henry.js
