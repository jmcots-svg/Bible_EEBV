name: Seed Commentary

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Idioma del comentario (es/en)'
        required: true
        default: 'es'
        type: choice
        options:
          - es
          - en
      source:
        description: 'Nombre de la fuente (MHC, etc.)'
        required: true
        default: 'MHC'

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  COMMENTARY_LANG: ${{ github.event.inputs.language }}
  COMMENTARY_SOURCE: ${{ github.event.inputs.source }}

jobs:
  seed-commentary:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          npm install fast-xml-parser
      
      - name: Generate Prisma Client
        run: npx prisma generate
      
      - name: Verify XML files exist
        run: |
          echo "📁 Verificando archivos de comentarios..."
          ls -la data/MHC/ || echo "⚠️ Directorio data/MHC no encontrado"
          test -f data/MHC/mhc1.xml && echo "✅ mhc1.xml encontrado" || echo "❌ mhc1.xml NO encontrado"
      
      - name: Run Commentary Seed
        run: node seed_henry.js
      
   
