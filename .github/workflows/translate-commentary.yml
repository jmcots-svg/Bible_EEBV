name: Translate Commentaries to Spanish

on:
  workflow_dispatch: # 👈 Esto te permite darle al botón "Run workflow" manualmente en GitHub

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run commentary translation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }} # 👈 ¡Acuérdate de añadir este secreto en GitHub!
          TARGET_LANG: es
        timeout-minutes: 360 # 6 horas máximo
        run: npm run translate:commentary
