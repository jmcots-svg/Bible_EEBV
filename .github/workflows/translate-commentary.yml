name: 🌐 Translate Commentaries (Storage)

on:
  workflow_dispatch:
    inputs:
      target_lang:
        description: 'Idioma destino (código ISO)'
        required: true
        default: 'ca'
        type: choice
        options:
          - ca
          - es
          - fr
          - de
          - pt
          - it
      commentary_abbr:
        description: 'Abreviatura del comentario (ej: luther, MHC, JFB). Vacío = todos los pendientes.'
        required: false
        default: ''
        type: string

jobs:
  translate:
    name: 🔄 Traducir comentarios → ${{ inputs.target_lang }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🧾 Info de ejecución
        run: |
          echo "════════════════════════════════════════"
          echo "  🌐 Idioma destino  : ${{ inputs.target_lang }}"
          echo "  📖 Comentario      : ${{ inputs.commentary_abbr || 'TODOS los pendientes' }}"
          echo "  📁 Fichero fuente  : ${{ inputs.commentary_abbr }}_en.json"
          echo "  📁 Fichero destino : ${{ inputs.commentary_abbr }}_${{ inputs.target_lang }}.json"
          echo "════════════════════════════════════════"

      - name: 🌐 Traducir
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEYS:      ${{ secrets.GEMINI_API_KEYS }}
          STORAGE_BASE_URL:     ${{ secrets.STORAGE_BASE_URL }}
          TARGET_LANG:          ${{ inputs.target_lang }}
          TARGET_COMMENTARY:    ${{ inputs.commentary_abbr }}
        run: node scripts/translate-commentaries-storage.js

      - name: ✅ Resumen
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "  Ejecución finalizada"
          echo "  Idioma   : ${{ inputs.target_lang }}"
          echo "  Fichero  : ${{ inputs.commentary_abbr || 'todos' }}_${{ inputs.target_lang }}.json"
          echo "════════════════════════════════════════"
