name: Translate Commentaries

on:
  workflow_dispatch:
    inputs:
      target_lang:
        description: 'Idioma destino para traducir'
        required: true
        default: 'es'
        type: choice
        options:
          - ca  # Catalán
          - es  # Español

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run commentary translation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # 👇 Aquí inyectamos la elección que hiciste en el menú de GitHub
          TARGET_LANG: ${{ github.event.inputs.target_lang }}
        timeout-minutes: 360 # 6 horas máximo
        run: npm run translate:commentary
