name: Seed Calvin Commentary

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Idioma del comentario'
        required: true
        default: 'en'
        type: choice
        options:
          - en
      source:
        description: 'Nombre de la fuente'
        required: true
        default: 'CALVIN'        # ⭐ Cambiado

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  COMMENTARY_LANG: ${{ github.event.inputs.language }}
  COMMENTARY_SOURCE: ${{ github.event.inputs.source }}

jobs:
  seed-calvin:                   # ⭐ Cambiado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify XML file exists
        run: |
          echo "📁 Verificando archivo Calvin.xml..."
          if [ -f "data/Calvin.xml" ]; then
            echo "✅ Calvin.xml encontrado"
            ls -lh data/Calvin.xml
          else
            echo "❌ Calvin.xml NO encontrado"
            ls -la data/ || echo "⚠️ Directorio data/ no existe"
            exit 1
          fi

      - name: Run Calvin Commentary Seed
        run: node seed_calvin.js  # ⭐ Cambiado
