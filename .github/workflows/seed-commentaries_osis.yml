name: Seed Luther ES Commentary

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Idioma del comentario'
        required: true
        default: 'es'
        type: choice
        options:
          - es
      source:
        description: 'Nombre de la fuente'
        required: true
        default: 'LUTHER_ES'

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  COMMENTARY_LANG: ${{ github.event.inputs.language }}
  COMMENTARY_SOURCE: ${{ github.event.inputs.source }}

jobs:
  seed-luther-es:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify XML file exists
        run: |
          echo "📁 Verificando archivo Luther_ES.xml..."
          if [ -f "data/Luther_ES.xml" ]; then
            echo "✅ Luther_ES.xml encontrado"
            ls -lh data/Luther_ES.xml
          else
            echo "❌ Luther_ES.xml NO encontrado"
            ls -la data/ || echo "⚠️ Directorio data/ no existe"
            exit 1
          fi

      - name: Run Luther ES Commentary Seed
        run: node seed_luther_es.js
